# Explicit opt-in: budgets are Codex proposal turns, NOT inference requests.
# Uses the existing local `codex login` ChatGPT session; no API key fields.
n_agents: 4
slots: 2
rounds: 20
warm_opportunities_per_agent: 5
warm_concurrency: 4
cpu_workers: 4
instance_workers: 1
mode: pace
profile: codex_session_pilot
seed: 0
coral:
  backend_factory: maestro.backends.codex_session.backend:session_factory
  checkout_path: vendor/coral
  revision: '0123dfb939b35228cf2c1fde224cd0561e727408'
  # Verified through this machine's logged-in Codex app-server model/list.
  model: gpt-6-astra
  director_mode: predeclared
  session_timeout_seconds: 120
pace:
  panel_manifest: data/training/panel.json
  heldout_manifest: data/heldout/panel.json
  seed_solver: data/seed_solver
  contract:
    # Fill with a qualified digest-pinned image and actual identifiers.
    image: ''
    hardware_id: UNSPECIFIED
    toolchain_digest: UNSPECIFIED
