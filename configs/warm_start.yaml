n_agents: 4
slots: 2
rounds: 20
warm_opportunities_per_agent: 5
warm_concurrency: 4
cpu_workers: 20
instance_workers: 5
mode: pace
profile: v1_cooperative
seed: 0
planning_calls: 1
generation_calls: 3
planning_window_seconds: 120
generation_window_seconds: 300
panel_size: 20
instance_cpu_seconds: 30
verification_cpu_seconds: 20
coral:
