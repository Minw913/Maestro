  checkout_path: vendor/coral
  revision: '0123dfb939b35228cf2c1fde224cd0561e727408'
  model: gpt-6-astra
  codex_cli_version: 'codex-cli 0.156.1'
  director_mode: predeclared
pace:
  panel_manifest: data/training/panel.json
  seed_solver: data/seed_solver
  contract:
    # Supply qualified execution-platform values before launch.
    image: ''
    hardware_id: UNSPECIFIED
    toolchain_digest: UNSPECIFIED
    cpu_seconds_per_instance: 30
    wall_seconds_per_instance: 45
    verification_cpu_seconds: 20
    verification_wall_seconds: 30
