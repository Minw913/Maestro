# Opt-in runtime. No credentials are stored here. Not yet live-qualified.
kind: runtime
schema_version: 1
profile: v1_cooperative
coral:
  backend_factory: maestro.backends.coral.deepseek_backend:native_factory
  runtime: dsh
  revision: '0123dfb939b35228cf2c1fde224cd0561e727408'
  model: deepseek-flash
  director_mode: predeclared
  deepseek_api_base: https://api.deepseek.com/anthropic
  deepseek_api_key_env: DEEPSEEK_API_KEY
  deepseek_reasoning_effort: low
  deepseek_max_output_tokens: 96000
  deepseek_transport_retry:
    max_retries_per_request: 1
    max_extra_requests: 20
    backoff_seconds: 10.0
    continue_after_network_failure: true
    warm_seed_fallback: true
  # Install and audit dsh, then freeze its full --version output and binary SHA256.
  deepseek_cli_version: UNQUALIFIED
  deepseek_cli_sha256: ''
