[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-market"
version = "0.1.0"
description = "Transactional compute allocation for Coral research agents"
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv>=1.2.4,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
plots = ["matplotlib>=3.9,<4"]

[project.scripts]
maestro = "maestro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"maestro.storage" = ["schema.sql"]
"maestro.tasks.pace" = ["data/*.gr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra"

[tool.basedpyright]
pythonVersion = "3.12"  # requires-python's floor; editors otherwise guess an interpreter
extraPaths = ["src", "scripts"]  # src layout, plus scripts so tests can import them typed
